map $http_upgrade $shared_browser_connection {
  default upgrade;
  '' close;
}

server {
  listen 127.0.0.1:8090;
  server_name 127.0.0.1 localhost;

  location / {
    proxy_pass https://127.0.0.1:8443;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8443;
    proxy_set_header Origin https://127.0.0.1:8443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $shared_browser_connection;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_ssl_verify off;
  }
}
