name: t3-controller

services:
  controller:
    image: ${T3CODE_IMAGE:-t3-code-controller:local}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${T3CODE_BIND_ADDRESS:-127.0.0.1}:${T3CODE_PORT:-3777}:3777"
    environment:
      T3CODE_CLOUD_CONTROLLER: "1"
      T3CODE_CLOUD_AWS_REGION: ${T3CODE_CLOUD_AWS_REGION:-us-west-1}
      T3CODE_CLOUD_PROJECT: ${T3CODE_CLOUD_PROJECT:-t3-cloud-agents}
      T3CODE_CLOUD_MAX_QUEUE_DEPTH: ${T3CODE_CLOUD_MAX_QUEUE_DEPTH:-8}
      T3CODE_CLOUD_MAX_RUN_SECONDS: ${T3CODE_CLOUD_MAX_RUN_SECONDS:-7200}
      T3CODE_CLOUD_MAX_INPUT_WAIT_SECONDS: ${T3CODE_CLOUD_MAX_INPUT_WAIT_SECONDS:-900}
      T3CODE_CLOUD_PREVIEW_LEASE_SECONDS: ${T3CODE_CLOUD_PREVIEW_LEASE_SECONDS:-900}
      T3CODE_CLOUD_PREVIEW_LEASE_MAX_SECONDS: ${T3CODE_CLOUD_PREVIEW_LEASE_MAX_SECONDS:-14400}
      T3CODE_CLOUD_WORKER_PRICES: ${T3CODE_CLOUD_WORKER_PRICES:-t3.medium=0.0496}
      T3CODE_CLOUD_CONTROLLER_URL: ${T3CODE_CLOUD_CONTROLLER_URL:-}
      T3CODE_CLOUD_WORKER_ROUTE_URL: ${T3CODE_CLOUD_WORKER_ROUTE_URL:-}
      T3CODE_CLOUD_GITHUB_TOKEN_SECRET_REF: ${T3CODE_CLOUD_GITHUB_TOKEN_SECRET_REF:-}
      T3CODE_CLOUD_GIT_SSH_SECRET_REF: ${T3CODE_CLOUD_GIT_SSH_SECRET_REF:-}
      T3CODE_CLOUD_CODEX_AUTH_JSON_SECRET_REF: ${T3CODE_CLOUD_CODEX_AUTH_JSON_SECRET_REF:-}
      T3CODE_CLOUD_CLAUDE_OAUTH_TOKEN_SECRET_REF: ${T3CODE_CLOUD_CLAUDE_OAUTH_TOKEN_SECRET_REF:-}
      T3CODE_HOME: /var/lib/t3
      T3CODE_HOST: 0.0.0.0
      T3CODE_NO_BROWSER: "1"
      T3CODE_PORT: "3777"
    volumes:
      - t3-controller-data:/var/lib/t3
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3777/').then(r=>{if(!r.ok)throw new Error(String(r.status))}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

volumes:
  t3-controller-data:
    name: ${T3CODE_DATA_VOLUME:-t3-controller-data}
